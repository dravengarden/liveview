<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test HTML</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            line-height: 1.6;
        }
        h1 { color: #333; }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            background: #f9f9f9;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>HTML Preview Test</h1>
    <p>This is a test HTML file to verify the HTML viewer works correctly.</p>

    <div class="card">
        <h2>Interactive Element</h2>
        <p>Click the button to test JavaScript:</p>
        <button onclick="alert('Hello from LiveView!')">Click Me</button>
    </div>

    <div class="card">
        <h2>Features</h2>
        <ul>
            <li>CSS Styling</li>
            <li>JavaScript Execution</li>
            <li>Responsive Layout</li>
        </ul>
    </div>
</body>
</html>
