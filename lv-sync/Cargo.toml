# lv-sync — platform-agnostic Merkle/sync/storage CORE for the liveview client.
#
# Pure logic: it never touches the filesystem, OPFS, IndexedDB, or the network
# directly. The platform supplies a `BlobStore` + `Fetcher` (traits below) and the
# engine drives the rest. This is the NATIVE core for the iOS/Mac Tauri shells
# (eager mode): a filesystem store + reqwest fetcher feed it. The web/PWA is NOT
# a consumer — it stays plain TypeScript (lazy mode: SW cache-first + on-demand
# loading), so no WASM target. Intentionally NOT a member of the server crate's
# build (no [workspace] there) so the deployed server's Nix build is untouched;
# the server can later depend on it by path to share the Merkle code.
[package]
name = "lv-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Merkle/sync/storage core for the liveview native (iOS/Mac) client"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
blake3 = "1"
# SQLite store (cross-platform: iOS · macOS · Android). `bundled` compiles a
# vendored SQLite (C) per target via the cc crate + the target's clang, so there's
# no reliance on a system libsqlite3 being present/findable when cross-compiling
# to aarch64-apple-ios. One portable store, no per-platform Swift shim.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
pollster = "0.4"
# For the live end-to-end native test (tests/native_e2e.rs, #[ignore]'d — needs
# the local backend on :4160). NOT a runtime dep: the shell supplies the Fetcher.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"
