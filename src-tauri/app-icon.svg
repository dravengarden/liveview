<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0d1117"/>
  <!-- favicon glyph (32u), scaled to ~40% + centred = the apple-touch framing
       (the PWA's iOS home icon): small glyph, lots of black around it. -->
  <g transform="translate(192,192) scale(20)">
    <rect x="6" y="8" width="12" height="16" rx="2" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="14" y="12" width="12" height="12" rx="2" fill="#ffffff"/>
  </g>
</svg>
