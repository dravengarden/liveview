# liveview native shell (Tauri 2).
#
# This crate bundles the web shell and adds the native capabilities that a PWA
# cannot provide: offline
# content via the lvsync custom scheme, background/lock-screen audio, haptics,
# and app-settings integration. It is not a second copy of the server.
# A configured remote LiveView server supplies the content, because a pure-web
# PWA on iOS CANNOT keep an audiobook playing once the screen
# locks / the app backgrounds, nor drive the lock-screen media controls — only a
# native shell (UIBackgroundModes=audio + an AVAudioSession in the Playback
# category) can. See src-tauri/README.md.
#
# Separate crate with its own Cargo.lock; the repo-root liveview package and the
# Nix flake build are untouched (the flake builds the server only).
[package]
name = "liveview-app"
version = "0.1.0"
description = "LiveView native shell with offline reading and background audio"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95"

# Mobile (iOS/Android) links the app as a shared/static lib loaded by the
# platform entry point; desktop uses the rlib + the main.rs binary. All three
# crate-types are required for `tauri ios`/`android` to build.
[lib]
name = "liveview_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[package.metadata.cargo-machete]
# Referenced from build.rs, which cargo-machete does not inspect.
ignored = ["tauri-build"]

[dependencies]
tauri = { version = "2", features = [] }
# Only native command the shell exposes: open the iOS app-settings page from the
# shell's network error UI (where the Local Network toggle lives). On iOS the
# opener routes `app-settings:` through UIApplication.open; a no-op everywhere the
# loader's error card never shows (desktop/Android).
tauri-plugin-opener = "2"
# Native OS haptics (real UIImpactFeedbackGenerator on iOS — the only reliable
# iOS haptic; Safari/PWA has none). The remote liveview UI calls
# `plugin:haptics|*` via the injected IPC bridge; granted to the app origin in
# capabilities/app-origin.json. installHaptics() (web) buzzes every control.
tauri-plugin-haptics = "2"
# Cross-platform Rust offline data layer (lv-sync core + SqliteBlobStore), served
# to the bundled SPA via the `lvsync://` URI scheme because iOS webview-to-plugin
# IPC is unreliable. Cross-compiles to aarch64-apple-ios (verified).
tauri-plugin-lvsync = { path = "../../plugins/lvsync" }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"
