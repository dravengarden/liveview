[package]
name = "liveview"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Fast live-reloading file previewer for Markdown, images, PDFs and more"
license = "MIT"
repository = "https://github.com/dravengarden/liveview"
homepage = "https://github.com/dravengarden/liveview"
keywords = ["markdown", "preview", "live-reload", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "liveview"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Object-safe async traits (Arc<dyn ContentStore> / Arc<dyn BlobStore>) so the
# same server handlers run over EITHER the postgres+rustfs backend (deployed)
# or a filesystem backend (local `liveview preview`, no deploy).
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["ws"] }
comrak = "0.36"
regex = "1"
notify-debouncer-full = "0.4"
globset = "0.4"
# Directory recursion for `liveview check` (expand a dir into its *.md files).
walkdir = "2"
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "fs"] }
open = "5"
futures-util = "0.3"
mime_guess = "2"
# Deterministic deploy-time card thumbnails. The shelf must not decode full-size
# hero backdrops while scrolling; original artwork remains a separate DAG blob.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
toml = "0.8"
serde_yml = "0.0.12"
# Content + reading-progress store. Runtime-checked queries only (no
# compile-time macros) so the Nix build needs no DATABASE_URL. postgres-only —
# the server read-path is fully off the filesystem (pg + rustfs).
sqlx = { version = "0.8", features = [ "runtime-tokio", "postgres" ] }

# Content-addressing for the sync Merkle DAG (leaf + tree node hashes).
blake3 = "1"

# S3 client for the private rustfs object store (book blobs: images, PDFs,
# covers, audio mp3 + marks). Talks to rustfs's S3 API over loopback HTTP.
aws-sdk-s3 = "1"
aws-smithy-runtime-api = "1"

# Minimal HTTP client for the APM ingest → VictoriaLogs forwarder (POST NDJSON to
# the host VL on loopback). default-features=false: no TLS/http2/proxy — the target
# is plain http://127.0.0.1:6302, so the base HTTP/1 client is all we need, and it
# keeps the dep light.
reqwest = { version = "0.12", default-features = false }

# Embedded assets
include_dir = { version = "0.7", optional = true }

# Math validation for `liveview check`: runs the REAL KaTeX (bundled JS) in an
# in-process quick-js engine — not deno, no DOM. This is the only way to match
# the client's KaTeX exactly; a pure-Rust LaTeX parser (pulldown-latex) rejected
# 14% of the corpus's valid KaTeX (`\tag`, `\operatorname`, `\boldsymbol`, …) as
# false positives. The crate bundles KaTeX 0.16.4; the client self-hosts 0.16.21
# (same 0.16 command set — patch releases don't change accepted syntax). We use
# only its parse errors, as a "won't render in the reader" signal.
katex = "0.4.6"
typst-syntax = "0.14.2"
roxmltree = "0.21.1"

[features]
default = []
embedded = ["dep:include_dir"]

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"
