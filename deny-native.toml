[graph]
targets = ["aarch64-apple-darwin", "aarch64-apple-ios"]
all-features = true

[advisories]
# Current Tauri 2.11.5 pulls urlpattern 0.3, whose rust-unic parser stack is
# unmaintained but has no known vulnerability or safe upstream replacement.
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "Latest Tauri urlpattern transitive dependency; no safe upgrade" },
  { id = "RUSTSEC-2025-0080", reason = "Latest Tauri urlpattern transitive dependency; no safe upgrade" },
  { id = "RUSTSEC-2025-0081", reason = "Latest Tauri urlpattern transitive dependency; no safe upgrade" },
  { id = "RUSTSEC-2025-0098", reason = "Latest Tauri urlpattern transitive dependency; no safe upgrade" },
  { id = "RUSTSEC-2025-0100", reason = "Latest Tauri urlpattern transitive dependency; no safe upgrade" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Tauri coordinates platform and webview generations internally; version
# findings in that latest upstream graph are not directly actionable here.
skip-tree = [{ name = "tauri" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
