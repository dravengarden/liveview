<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>LiveView</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA / installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- theme-color is rewritten at runtime by useTheme to the active theme's
         surface colour; this static value is only the pre-hydration default.
         status-bar-style is "default" (not "black-translucent") so iOS paints
         the status bar with theme-color and auto-picks a contrasting text
         colour — black-translucent would force permanently-white glyphs that
         vanish on light themes. -->
    <meta name="theme-color" content="#0d1117" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiveView" />
    <!-- Syntax highlighting -->
    <script src="/highlight.min.js"></script>
    <!-- Diagrams -->
    <script src="/mermaid.min.js"></script>
    <!-- Math rendering (KaTeX) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js" crossorigin="anonymous"></script>
    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script>
      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
      require(['vs/editor/editor.main'], function() {
        window.monaco = monaco;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
