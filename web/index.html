<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>LiveView</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA / installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- theme-color is rewritten at runtime by useTheme to the active theme's
         surface colour; this static value is only the pre-hydration default.
         status-bar-style is "default" (not "black-translucent") so iOS paints
         the status bar with theme-color and auto-picks a contrasting text
         colour — black-translucent would force permanently-white glyphs that
         vanish on light themes. -->
    <meta name="theme-color" content="#0d1117" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiveView" />
    <!-- No render libraries here: highlight.js, mermaid AND KaTeX all load ON
         DEMAND (src/ensureAsset.ts) only when a chapter needs them, and are
         fully SELF-HOSTED (/highlight.min.js, /mermaid.min.js, /katex/*) — no
         CDN at all, so nothing depends on jsdelivr (slow/blocked behind the GFW)
         and everything works offline. Monaco was dropped (JSON pretty-prints). -->

    <!-- App-shell splash (the spinner + #root markup) is injected at build time
         by the vite splashInjector plugin from the shared @shared-utils/ui
         splashHtml() — one source across all atlantis apps. -->

    <!-- One-shot boot self-heal. If the app shell fails to start — a hashed
         chunk 404s, or a stale precache references a chunk that no longer
         exists, so React never initializes (the classic `useSyncExternalStore
         of null` white screen) — wipe the SW + versioned caches (keeping the
         immutable lv-blobs library) and hard-reload ONCE. Installed in <head>
         so it also catches a failure of the entry module itself, which code
         inside that module never could. sessionStorage-guarded against reload
         loops; main.tsx clears the guard once the app has actually mounted, so
         a genuine (non-cache) error can't loop and a later staleness can still
         heal. Belt-and-suspenders behind the build-stamped SW precache. -->
    <script>
      (function () {
        var KEY = "lv-boot-heal";
        function isBootFailure(msg) {
          return /useSyncExternalStore|dynamically imported module|Importing a module script failed|Failed to fetch|ChunkLoadError|error loading dynamically/i.test(
            msg || "",
          );
        }
        function heal(msg) {
          if (!isBootFailure(msg)) return;
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, "1");
          } catch (_) {
            return;
          }
          var reload = function () {
            location.reload();
          };
          Promise.resolve()
            .then(function () {
              return self.caches
                ? caches.keys().then(function (keys) {
                    return Promise.all(
                      keys
                        .filter(function (k) {
                          return k !== "lv-blobs";
                        })
                        .map(function (k) {
                          return caches.delete(k);
                        }),
                    );
                  })
                : null;
            })
            .then(function () {
              return navigator.serviceWorker
                ? navigator.serviceWorker
                    .getRegistrations()
                    .then(function (regs) {
                      return Promise.all(
                        regs.map(function (r) {
                          return r.unregister();
                        }),
                      );
                    })
                : null;
            })
            .then(reload, reload);
        }
        addEventListener("error", function (e) {
          heal((e && e.message) || (e && e.error && e.error.message));
        });
        addEventListener("unhandledrejection", function (e) {
          heal(e && e.reason && (e.reason.message || String(e.reason)));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
