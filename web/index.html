<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>LiveView</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA / installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- theme-color is rewritten at runtime by useTheme to the active theme's
         surface colour; this static value is only the pre-hydration default.
         status-bar-style is "default" (not "black-translucent") so iOS paints
         the status bar with theme-color and auto-picks a contrasting text
         colour — black-translucent would force permanently-white glyphs that
         vanish on light themes. -->
    <meta name="theme-color" content="#0d1117" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiveView" />
    <!-- Heavy renderers are loaded ON DEMAND (src/ensureAsset.ts), not here:
         highlight.js + mermaid (~3 MB) load only when a chapter has code /
         diagrams. Monaco is gone entirely — the JSON viewer pretty-prints
         instead (it was ~5 MB of CDN for a rarely-opened file type). KaTeX
         stays CDN-loaded for now (Phase 2: self-host + on-demand; jsdelivr is
         slow/blocked behind the GFW and dead offline). -->
    <!-- Math rendering (KaTeX) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js" crossorigin="anonymous"></script>
    <!-- App-shell splash: pure HTML/CSS so it paints with the document on any
         network, before the SPA bundle downloads/parses. React's createRoot
         replaces #root's children on mount, so it auto-vanishes when the app is
         ready — no teardown JS. Themed by prefers-color-scheme to avoid a flash
         on dark. -->
    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #fbf7ee; color: #6b5b4b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif;
      }
      @media (prefers-color-scheme: dark) { #app-splash { background: #0d1117; color: #8b949e; } }
      #app-splash .lv-spinner {
        width: 34px; height: 34px; border: 3px solid currentColor; border-top-color: transparent;
        border-radius: 50%; opacity: .65; animation: lv-spin .8s linear infinite;
      }
      #app-splash .lv-title { font-size: 14px; letter-spacing: .06em; opacity: .75; }
      @keyframes lv-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #app-splash .lv-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-label="Loading" role="status">
        <div class="lv-spinner"></div>
        <div class="lv-title">LiveView</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
