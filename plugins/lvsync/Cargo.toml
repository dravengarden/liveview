# Tauri plugin wrapping the lv-sync native offline data layer.
#
# WHY a plugin (not app #[tauri::command]s): the shell loads the REMOTE web UI,
# and in Tauri 2 a remote origin can invoke ONLY plugin commands granted via ACL
# permission tokens — plain app commands are unreachable from remote. (Proven on
# device: app-command `lv_resolve` never ran while the manifest fetch did.) So the
# data layer lives here as a plugin, mirroring tauri-plugin-haptics; the remote
# origin is granted `lvsync:allow-*` in capabilities/remote-sync.json.
#
# `links` is REQUIRED so the app build discovers this plugin's generated
# permissions (the build.rs `tauri_plugin::Builder` emits them keyed by `links`).
[package]
name = "tauri-plugin-lvsync"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-lvsync"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "sync"] }
# Bounded-concurrency streams for sync_all (buffer_unordered). Already in the tree
# transitively via reqwest, so no new download.
futures-util = "0.3"
serde_json = "1"
# The shared Merkle/resolve/retention core + its filesystem store. Same path the
# shell used before (sibling of the shell dir): tauri-shell/../lv-sync.
lv-sync = { path = "../../lv-sync" }
# Native HTTP fetcher. rustls-tls (pure Rust) works on iOS; the liveview origin
# is a public Let's Encrypt cert so webpki roots validate it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
